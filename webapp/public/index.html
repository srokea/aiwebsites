<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cold Calls</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9E</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bg-particles" id="bg-particles" aria-hidden="true"></div>

<div class="wrap">
  <div class="topbar">
    <div class="topbar-title-row">
      <div>
        <h1>💰 Cold Calls</h1>
        <div class="topbar-sub">MMates first 10k</div>
      </div>
      <div class="team-status" id="team-status"></div>
    </div>
    <div id="user-widget"></div>
  </div>

  <div class="sticky-search-bar" id="global-search-bar">
    <div class="search-wrap">
      <input type="text" id="global-search" class="search-input" placeholder="🔍 Szukaj leada...">
      <button type="button" class="search-clear hidden" id="global-search-clear" title="Wyczyść szukanie">✕</button>
      <div class="sticky-search-results hidden" id="global-search-results"></div>
    </div>
  </div>

  <div class="greeting-panel" id="greeting-panel"></div>

  <a class="finance-panel" id="finance-panel" href="/kasa.html"></a>

  <!-- statystyki + wykres w jednym kontenerze z jednym tlem (wewnetrzne podzialy hairline) -->
  <div class="overview-panel">
    <div class="stat-row" id="global-stats"></div>
    <div class="donut-row" id="donut-row"></div>
  </div>

  <div class="upcoming-head">
    <div class="section-title" style="margin-bottom:0;">Najbliższe</div>
    <label class="mine-switch">
      <input type="checkbox" id="upcoming-mine-toggle">
      <span class="mine-switch-track"><span class="mine-switch-thumb"></span></span>
      <span class="mine-switch-label">Tylko moje</span>
    </label>
  </div>
  <div class="upcoming-panel" id="upcoming-panel"></div>

  <div class="tools-nav">
    <a class="tools-nav-btn" href="/kalendarz.html">📅 Kalendarz</a>
    <a class="tools-nav-btn" href="/reviews.html">🔗 Karty NFC</a>
  </div>

  <div class="section-title">Nisze</div>
  <div class="niche-panel" id="niche-grid"></div>
</div>

<div class="modal-overlay hidden" id="today-tasks-modal">
  <div class="modal">
    <h3>📌 Na dziś</h3>
    <div class="today-tasks-sub">Zaplanowane na dzisiaj — Meety, oddzwonienia, SMS-y.</div>
    <div class="today-tasks-list" id="today-tasks-list"></div>
    <div class="actions">
      <button type="button" class="btn primary" id="today-tasks-ok">Rozumiem</button>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="import-modal">
  <div class="modal">
    <h3>Nowa nisza — import CSV</h3>
    <form id="import-form">
      <label for="niche-name">Nazwa niszy</label>
      <input type="text" id="niche-name" name="name" placeholder="np. Fryzjerzy" required>

      <label for="niche-file">Plik CSV</label>
      <input type="file" id="niche-file" name="file" accept=".csv,text/csv" required>
      <div class="hint">Pierwszy wiersz pliku musi zawierac nazwy kolumn. Mapowanie kolumn (nazwa, telefon, tagi platform itd.) dobiera sie automatycznie.</div>

      <div class="error" id="import-error" style="display:none;"></div>

      <div class="actions">
        <button type="button" class="btn" id="import-cancel">Anuluj</button>
        <button type="submit" class="btn primary">Importuj</button>
      </div>
    </form>
  </div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth-widget.js"></script>
<script src="/js/index.js"></script>
</body>
</html>
