<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheme rozmowy — Cold Calls</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9E</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bg-particles" id="bg-particles" aria-hidden="true"></div>

<div class="wrap narrow">
  <div class="script-topbar">
    <a class="script-back" id="back-link" href="/">&larr; Powrot</a>
    <div style="display:flex; align-items:center; gap:14px;">
      <div id="user-widget"></div>
      <button type="button" class="icon-btn edit-toggle" id="edit-toggle" title="Włącz edycję treści" aria-pressed="false">✏️</button>
    </div>
  </div>

  <div class="edit-banner hidden" id="edit-banner">
    Tryb edycji — kliknij treść, żeby ją zmienić. Zmiany trafiają do pliku
    <code id="edit-file"></code> i zobaczą je wszystkie leady tej niszy.
    Tokeny <code>{firma}</code>, <code>{miasto}</code>, <code>{platforma}</code> zostaw w treści — podstawią się same.
  </div>

  <div class="lead-context" id="lead-context"></div>

  <div class="lead-panel" id="lead-panel"></div>

  <div class="script-header">
    <h1 id="script-title">Scheme rozmowy</h1>
    <p id="script-subtitle"></p>
  </div>

  <div class="sms-note" id="sms-note"></div>

  <div id="script-body"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth-widget.js"></script>
<script src="/js/script.js"></script>
</body>
</html>
