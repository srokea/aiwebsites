<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa — Cold Calls</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%97%BA%EF%B8%8F</text></svg>">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body class="map-page">

<div id="map"></div>

<div class="map-ui">
  <div class="map-overlay map-topbar">
    <a class="icon-btn icon-btn-back" href="/" title="Dashboard">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </a>
    <div id="user-widget"></div>
    <div class="map-topbar-title">
      <strong>🗺️ Mapa — karty NFC</strong>
      <span class="map-count" id="map-count"></span>
    </div>
  </div>

  <div class="map-overlay map-filters">
    <label class="map-field">
      <span>Ulica</span>
      <select id="map-street"><option value="">wszystkie</option></select>
    </label>
    <label class="map-field">
      <span>Kategoria</span>
      <select id="map-category"><option value="">wszystkie</option></select>
    </label>
    <label class="map-field">
      <span>Stan</span>
      <select id="map-status"><option value="">wszystkie</option></select>
    </label>
    <div class="map-layers">
      <label><input type="checkbox" id="layer-osm" checked> Firmy z OSM</label>
      <label><input type="checkbox" id="layer-leads" checked> Leady z niszy</label>
    </div>
    <div class="map-legend" id="map-legend"></div>
  </div>

  <div class="map-overlay map-detail" id="map-detail" hidden></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/auth-widget.js"></script>
<script src="/js/mapa.js"></script>
</body>
</html>
