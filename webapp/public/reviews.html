<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karty NFC — Cold Calls</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%93%9E</text></svg>">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="bg-particles" id="bg-particles" aria-hidden="true"></div>

<div class="wrap">
  <div class="topbar">
    <div>
      <h1>🔗 Karty NFC</h1>
      <div class="topbar-sub">Zarządzanie kartami z opiniami Google — mmates.pl/r/:slug</div>
    </div>
    <div style="display:flex; align-items:center; gap:14px;">
      <div id="user-widget"></div>
      <a class="icon-btn icon-btn-back" href="/" title="Dashboard">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </a>
    </div>
  </div>

  <div class="section-title">Nowa karta</div>
  <form class="review-form" id="review-form">
    <input type="text" id="rv-slug" placeholder="slug (np. salon-naomi)" required>
    <input type="text" id="rv-business" placeholder="Nazwa firmy" required>
    <input type="text" id="rv-tagline" placeholder="Tagline (opcjonalnie)">
    <input type="url" id="rv-google" placeholder="Link do opinii Google" required>
    <input type="text" id="rv-emoji" placeholder="Emoji (np. 💈)" maxlength="4">
    <input type="url" id="rv-logo" placeholder="Logo URL (opcjonalnie)">
    <label class="review-file-btn">
      📎 Logo z pliku
      <input type="file" id="rv-logo-file" accept="image/png,image/jpeg,image/webp" hidden>
    </label>
    <button type="submit" class="btn primary">Dodaj kartę</button>
    <div class="error" id="rv-error" style="display:none;"></div>
  </form>

  <div class="section-title">Karty</div>
  <div class="review-grid" id="review-grid"></div>
</div>

<script src="/js/api.js"></script>
<script src="/js/auth-widget.js"></script>
<script src="/js/reviews.js"></script>
</body>
</html>
