<!--
  Strona, do której prowadzi kod QR z lady. Trafia do folderu klienta jako opinia/index.html.
  Przy wdrożeniu (skill automation-setup):
  1. Podmień wszystko WIELKIMI LITERAMI.
  2. Przepisz 5 kolorów i 2 kroje pisma ze strony głównej klienta (jej tailwind.config i @font-face).
  3. Usuń przyciski, na które klient nie ma linku. Nie zostawiaj pustych href.
  4. Klient bez pliku logo: zamiast <img class="logo"> wstaw nazwę firmy krojem nagłówków.
  Bez zewnętrznych skryptów i bez CDN: strona nie wysyła nigdzie danych odwiedzającego.
-->
<style>
  /* Kroje pisma klienta: skopiuj jego reguły @font-face i popraw ścieżki na ../fonts/... */
  :root {
    --bg: KOLOR_TLA;
    --surface: KOLOR_POWIERZCHNI;
    --ink: KOLOR_TEKSTU;
    --muted: KOLOR_TEKSTU_DRUGORZEDNEGO;
    --accent: KOLOR_AKCENTU;
    --on-accent: KOLOR_TEKSTU_NA_AKCENCIE;
    --font-display: KROJ_NAGLOWKOW, serif;
    --font-body: KROJ_TEKSTU, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 2rem 1.25rem;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.55;
  }
  main { width: 100%; max-width: 26rem; text-align: center; }
  .logo { max-width: 9rem; height: auto; margin: 0 auto 1.75rem; display: block; }
  h1 { font-family: var(--font-display); font-size: 1.75rem; line-height: 1.2; margin: 0 0 .75rem; font-weight: 600; }
  p { margin: 0 0 1.75rem; color: var(--muted); }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: .6rem;
    min-height: 3.25rem; padding: 0 1.25rem; margin-bottom: .75rem;
    border-radius: 999px; border: 1px solid transparent;
    font: inherit; font-weight: 600; text-decoration: none; white-space: nowrap;
  }
  .btn-primary { background: var(--accent); color: var(--on-accent); }
  .btn-secondary { background: var(--surface); color: var(--ink); border-color: color-mix(in srgb, var(--ink) 14%, transparent); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .rest { margin-top: 1.75rem; }
  footer { margin-top: 2.25rem; font-size: .85rem; }
  footer a { color: var(--muted); }
</style>
</head>
