<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel rezerwacji — Alticcio</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">

<style>
  /* Fonty z serwera strony (RODO). Tylko latin + latin-ext, tylko używane grubości. */
  @font-face { font-family:'PT Serif'; font-style:normal; font-weight:400; font-display:swap;
    src:url('../fonts/ptserif-normal-400-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'PT Serif'; font-style:normal; font-weight:400; font-display:swap;
    src:url('../fonts/ptserif-normal-400-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'PT Serif'; font-style:normal; font-weight:700; font-display:swap;
    src:url('../fonts/ptserif-normal-700-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'PT Serif'; font-style:normal; font-weight:700; font-display:swap;
    src:url('../fonts/ptserif-normal-700-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
  @font-face { font-family:'Archivo Narrow'; font-style:normal; font-weight:400 700; font-display:swap;
    src:url('../fonts/archivonarrow-normal-400-700-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
  @font-face { font-family:'Archivo Narrow'; font-style:normal; font-weight:400 700; font-display:swap;
    src:url('../fonts/archivonarrow-normal-400-700-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }

  /* Paleta strony: kontrasty jak w index.html (ink/krem 16,42:1 · muted/krem 6,50:1 · krem/czerwień 5,16:1).
     Czerwień #C41E1E na kremie 5,16:1 — wystarcza też jako tekst. */
  :root {
    --red: #C41E1E; --red-deep: #8E1414; --cream: #F5EFE3; --surface: #EDE4D3;
    --border: #DDD1BD; --ink: #14110F; --muted: #5F5349;
    --ui: 'Archivo Narrow', system-ui, sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--cream); color: var(--ink);
    font-family: 'PT Serif', Georgia, serif; font-size: 1.05rem; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 3px; }
  button { font: inherit; color: inherit; }
  p { margin: 0; }

  #panel { max-width: 46rem; margin: 0 auto; padding: 16px 16px 64px; }
  .pn-center { padding: 64px 0; text-align: center; color: var(--muted); }

  /* ——— Formularze logowania ——— */
  .pn-box {
    display: grid; gap: 16px; margin: 48px auto 0; max-width: 26rem; padding: 28px 22px;
    background: #FBF7EF; border: 1px solid var(--border); border-radius: 18px;
  }
  .pn-title { margin: 0; font-size: 1.75rem; line-height: 1.2; }
  .pn-field { display: grid; gap: 6px; }
  .pn-label { font-family: var(--ui); font-size: .78rem; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
  .pn-input {
    width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--border); border-radius: 12px;
    background: #fff; color: var(--ink); font: inherit; font-size: 1.05rem;
  }
  .pn-input:focus { outline: none; border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .pn-status { min-height: 1.6em; color: var(--muted); }
  .pn-status:empty { min-height: 0; }

  .pn-btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 18px;
    border: 1px solid var(--ink); border-radius: 999px; background: transparent; cursor: pointer;
    font-family: var(--ui); font-size: .95rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  }
  .pn-btn:hover:not(:disabled) { background: var(--ink); color: var(--cream); }
  .pn-btn:disabled { opacity: .45; cursor: default; }
  .pn-btn-primary { min-height: 52px; background: var(--red); border-color: var(--red); color: var(--cream); }
  .pn-btn-primary:hover:not(:disabled) { background: var(--red-deep); border-color: var(--red-deep); }
  .pn-btn-danger { border-color: var(--red); color: var(--red); }
  .pn-btn-danger:hover:not(:disabled) { background: var(--red); border-color: var(--red); color: var(--cream); }
  .pn-link {
    justify-self: start; min-height: 44px; padding: 0; border: 0; background: none; cursor: pointer;
    color: var(--ink); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px;
  }
  .pn-link:hover { text-decoration-color: var(--ink); }

  /* ——— Widok dnia ——— */
  .pn-bar { display: flex; align-items: center; gap: 12px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .pn-brand { font-family: var(--ui); font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--red); }
  .pn-live {
    display: inline-flex; align-items: center; gap: 6px; margin-right: auto;
    font-family: var(--ui); font-size: .85rem; color: var(--muted);
  }
  .pn-live:not(:empty)::before { content: ''; width: 8px; height: 8px; border-radius: 999px; background: #2E7D32; }
  .pn-live.is-off::before { background: var(--red); }

  .pn-nav { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; margin-top: 20px; }
  .pn-round {
    width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 999px; background: transparent;
    cursor: pointer; font-size: 1.6rem; line-height: 1;
  }
  .pn-round:hover { border-color: var(--ink); }
  .pn-date { margin: 0; text-align: center; font-size: 1.35rem; line-height: 1.25; }
  .pn-date::first-letter { text-transform: uppercase; }

  .pn-tools { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 14px; }
  .pn-date-input { width: auto; min-height: 44px; }

  .pn-summary {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 16px;
    margin-top: 20px; padding: 12px 0; border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  }
  .pn-counters { font-family: var(--ui); font-size: 1.15rem; font-weight: 700; }

  .pn-list { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 12px; }
  .pn-empty { padding: 40px 0; text-align: center; color: var(--muted); }

  .pn-row {
    display: grid; gap: 10px; padding: 16px; border: 1px solid var(--border); border-radius: 14px; background: #FBF7EF;
    transition: background-color .6s;
  }
  @media (min-width: 640px) {
    .pn-row { grid-template-columns: 9.5rem 1fr auto; align-items: start; gap: 16px; }
  }
  .pn-row.is-new { background: #FBE3DF; border-color: var(--red); }
  .pn-row.is-cancelled { background: transparent; }
  .pn-row.is-cancelled .pn-time, .pn-row.is-cancelled .pn-name { text-decoration: line-through; color: var(--muted); }

  .pn-when { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  @media (min-width: 640px) { .pn-when { flex-direction: column; align-items: flex-start; } }
  .pn-time { font-family: var(--ui); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .pn-meta { font-family: var(--ui); color: var(--muted); }
  .pn-badge {
    display: inline-flex; padding: 1px 8px; border-radius: 999px; background: var(--red); color: var(--cream);
    font-family: var(--ui); font-size: .74rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  }
  .pn-badge-muted { background: var(--surface); color: var(--muted); }

  .pn-name { font-size: 1.15rem; font-weight: 700; }
  .pn-contact { display: flex; flex-wrap: wrap; gap: 0 16px; }
  .pn-phone, .pn-mail {
    display: inline-flex; align-items: center; min-height: 36px;
    color: var(--red); text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 4px;
  }
  .pn-phone { font-family: var(--ui); font-size: 1.1rem; font-weight: 700; }
  .pn-mail { overflow-wrap: anywhere; }
  .pn-comment { font-style: italic; }
  .pn-created { font-family: var(--ui); font-size: .85rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) { .pn-row { transition: none; } }
</style>
</head>
<body>
<main id="panel">
  <noscript><p class="pn-center">Panel wymaga włączonego JavaScriptu.</p></noscript>
</main>

<script type="module">
  import { mountPanel } from '../js/panel.js';
  import { createPanelApi } from '../js/panel-api.js';
  mountPanel(document.getElementById('panel'), createPanelApi());
</script>
</body>
</html>
