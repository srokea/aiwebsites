# Profile streamerow. Klucz = login na Twitchu.
# layout: wspolrzedne w pikselach zrodla [x, y, szerokosc, wysokosc].
#   facecam  - prostokat z kamerka (pomin, jesli streamer nie ma kamerki)
#   gameplay - prostokat z gra (pomin = caly kadr, crop do srodka)
# preroll  - ile sekund przed spike'iem czatu zaczac klip (czat reaguje po fakcie)
# campaign - nazwa pliku z config/campaigns/ (bez .yaml)
# rp       - true dla streamerow GTA roleplay (dodaje hashtag gtarp); domyslnie false
# tags     - opcjonalna lista stalych hashtagow streamera, bez # (np. [nazwakanalu]);
#            dochodza do podstawowych gta6/gtavi/gta/shorts, razem max 6
# signals  - zrodla kandydatow w trybie live; domyslnie [chat, viewer_clips]. Tylko
#            [viewer_clips] ma sens, gdy czat jest bezuzyteczny (maly kanal, RP: skoki czatu
#            nie zgadzaja sie z klipami widzow). Klipy widzow wymagaja kluczy Twitch w .env;
#            bez nich live jedzie tylko na czacie (jedno ostrzezenie na 10 min)
#
# Kamerki zmierzone 2026-11-16 na klatkach z VOD-ow (720p = 1280x720, tak nagrywamy),
# klatki i wyciete kamerki: data/layouts/<login>_<n>.png, <login>_cam.png.
# Na premierze GTA VI (19.11) uklad moze byc inny: sprawdzic na zywo, zanim puscimy publikacje.
# facecam: null = renderer daje powiekszony srodek kadru na rozmytym tle (bezpieczne, gdy
# kamerka skacze miedzy scenami albo stream jest IRL).

streamers:
  przyklad:
    platform: twitch
    preroll: 20
    postroll: 45
    lang: en
    layout:
      facecam: [0, 780, 400, 300]
      facecam_ratio: 0.35
    campaign: null
    rp: false
    tags: []

