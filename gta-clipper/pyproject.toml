[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gta-clipper"
version = "0.1.0"
description = "Lokalny kliper streamow: spike'i czatu -> pionowe klipy 9:16 -> akceptacja -> publikacja"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "faster-whisper>=1.0",
    "chat-downloader>=0.2.8",
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
clipper = "clipper.cli:main"

[tool.setuptools.packages.find]
include = ["clipper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
